# PMT-Skill v2 配置示例。相对路径均以本文件所在目录 src1 为基准。

[paths]
repo_root = ".."
android_world_root = "../libs/android_world"
skvm_skills_root = "/home/zmz/Workspace/gui/libs/skvm/skvm-data/skills"
ms_swift_root = "../libs/ms-swift"
state_dir = "./runtime"
# 每次 CLI 调用都会在该目录下创建“时间_命令_任务”子目录。
log_dir = "./runtime/logs"

[offline]
teacher_model_id = "teacher-deepseek-v4-flash"
student_model_path = "/home/zmz/Workspace/models/qwen3-vl-4b-instruct"
trajectory_dir = "./runtime/trajectories"
dataset_dir = "./runtime/dataset"
output_dir = "./runtime/checkpoints"
successful_only = false
validation_ratio = 0.05
max_pixels = 1003520
freeze_vit = false
epochs = 2.0
learning_rate = 0.0001
lora_rank = 16
lora_alpha = 32
# ms-swift SFT 使用的物理 GPU；多卡可写成 "2,3"。不设置则继承当前 shell。
# cuda_visible_devices = "2"

[training_evaluation]
# 训练进程退出后，框架在该端口临时执行 swift deploy，评测完立即回收。
deploy_host = "127.0.0.1"
deploy_port = 8002
infer_backend = "vllm"
# 控制是否生成完整的基座/技能库/最终对比报告；SR 早退由下方参数独立控制。
enabled = false
# 用这个画像继承模型能力先验；临时服务地址和 served_model 会由框架自动覆盖。
model_id = "student-qwen3-vl"
family = "android_world"
# 留空表示从 family 中按 seed 固定抽样；也可写成 ["TaskA", "TaskB"]。
tasks = []
task_count = 30
combinations = 1
seed = 42
# 1 表示每完成一个 epoch 测一次裸模型 SR；改成 2 就每两个 epoch 测一次。
# 启用早退时为了得到逐 epoch SR，该值会被有效地收紧为 1。
every_epochs = 1
# 默认所有 train（包括 --without-evaluation）都进行轻量 SR 早退探测。
# baseline 作为初始最佳值；连续 3 个 epoch 未提升超过 0.01（1 个百分点）即停止。
early_stopping_enabled = true
early_stopping_patience = 3
early_stopping_min_delta = 0.01
# 永久保留 checkpoint 的间隔；默认逐 epoch 保留，0 表示只保留最终 checkpoint。
checkpoint_every_epochs = 1
include_candidate_skills = false
# 显式覆盖模型 config.json 中的 262144，控制 vLLM KV cache 显存。
max_model_len = 32768
gpu_memory_utilization = 0.90
# 评测模型使用的物理 GPU，应与上面的训练 GPU 分开。
# cuda_visible_devices = "1"
startup_timeout_seconds = 600.0
startup_poll_seconds = 2.0
max_new_tokens = 2048
# 其余未结构化的 swift deploy 参数仍可从这里扩展。
deploy_extra_args = []

[routing]
# 总分 = log(成功率) - 延迟惩罚 - 切换惩罚 + polished 奖励 - 降级代价。
success_weight = 1.0
latency_weight = 0.0001
switch_weight = 0.003
polished_bonus = 0.05
degradation_weight = 0.02
minimum_capability = 0.05
maximum_candidates_per_position = 32

[maintenance]
minimum_support = 5
minimum_candidate_trials = 10
minimum_subsequence_length = 2
maximum_subsequence_length = 5
promotion_success_rate = 0.70
rollback_success_rate = 0.45
baseline_margin = 0.02
# 取消注释后，backend 每轮会用该模型编译一批 SKVM raw skills。
# raw_skill_compiler_model_id = "teacher-glm-vl"
raw_skill_compile_batch_size = 8

[android_world]
adb_path = "adb"
console_port = 5554
emulator_setup = false
# 每个 episode 最多 50 步；collector 还会在运行时强制执行这一硬上限。
max_steps = 50
stop_on_task_success = true
wait_after_action_seconds = 1.0
# a11y/ADB 失效后先恢复网络和转发；仍失败则重启 emulator guest 并重试当前 task。
# 0 表示关闭自动恢复。恢复耗尽时立即停止评测，避免后续任务全部空跑。
infrastructure_recovery_attempts = 1
recovery_timeout_seconds = 180.0
recovery_poll_seconds = 2.0

[[models]]
model_id = "teacher-deepseek-v4-flash"
served_model = "/home/zmz/Workspace/models/deepseek-v4-flash"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"
average_latency_ms = 2200.0
switch_cost_ms = 0.0
enabled = true

[[models]]
model_id = "student-base"
served_model = "/home/zmz/Workspace/models/qwen3.5-0.8b"
base_url = "http://127.0.0.1:8001/v1"
api_key_env = "PMTSKILL_STUDENT_API_KEY"
average_latency_ms = 600.0
switch_cost_ms = 50.0
enabled = true

[[models]]
model_id = "student-qwen3-vl"
served_model = "/home/zmz/Workspace/models/qwen3-vl-4b-instruct"
base_url = "http://127.0.0.1:8001/v1"
adapter = "./runtime/checkpoints/ui_grounding"
api_key_env = ""
average_latency_ms = 650.0
switch_cost_ms = 50.0
enabled = true

[[models]]
model_id = "student-ui-grounding-lora"
served_model = "qwen3.5-0.8b-grounding"
base_url = "http://127.0.0.1:8001/v1"
adapter = "./runtime/checkpoints/ui_grounding"
api_key_env = "PMTSKILL_STUDENT_API_KEY"
average_latency_ms = 650.0
switch_cost_ms = 50.0
enabled = true

[models.capabilities]
"ground.text" = 0.78
"ground.icon" = 0.74
"ground.bbox" = 0.76
"action.click" = 0.72
